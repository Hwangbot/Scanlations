name: Build and publish repo

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: Build extensions and publish to the repo branch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The SIGNING_KEY secret is missing. See README.md, 'One-time setup'."
            exit 1
          fi
          echo "$SIGNING_KEY" | base64 -d > main/signingkey.jks

      - name: Build extensions
        working-directory: main
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TASKS=()
          for dir in src/*/*/; do
            module=":${dir%/}"
            TASKS+=("${module//\//:}:assembleRelease")
          done
          ./gradlew "${TASKS[@]}"

      - name: Get signing key fingerprint
        id: fingerprint
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          sha=$(keytool -list -v -keystore main/signingkey.jks -alias "$ALIAS" -storepass "$KEY_STORE_PASSWORD" \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout repo branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" repo > /dev/null; then
            git clone --depth 1 --branch repo "$url" repo
          else
            git init -b repo repo
            git -C repo remote add origin "$url"
          fi

      - name: Publish repo
        env:
          FINGERPRINT: ${{ steps.fingerprint.outputs.sha }}
        run: |
          pip install 'protobuf>=7.35,<8'
          python -u main/.github/scripts/publish-repo.py main repo "$GITHUB_REPOSITORY" "$FINGERPRINT"
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update extensions repo from ${GITHUB_SHA::7}"
            git push origin repo
          fi

      - name: Clean up signing key
        if: always()
        run: rm -f main/signingkey.jks
