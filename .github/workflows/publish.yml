name: Build & publish extension store

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-repo
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # 1) Build signed APKs (Keiyoushi-style Gradle project). Skip if you drop prebuilt APKs into apk/.
      - name: Decode keystore
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > signingkey.jks
      - name: Build APKs
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          mkdir -p apk && find src -path '*/build/outputs/apk/release/*.apk' -exec cp {} apk/ \;
          rm -f signingkey.jks

      # 2) Generate index.pb / repo.json; signing key is derived from (and checked across) the APKs
      - name: Build index
        run: |
          pip install -q grpcio-tools protobuf
          python -m grpc_tools.protoc -I scripts --python_out=scripts scripts/index.proto
          export PATH="$PATH:$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)"
          python scripts/build_index.py manifest.json out --apk-dir apk
          mkdir -p out/icon && cp icon/*.png out/icon/ 2>/dev/null || true

      # 3) Publish to an orphan `repo` branch (keeps main history clean)
      - name: Push repo branch
        run: |
          cd out
          git init -q -b repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" repo
